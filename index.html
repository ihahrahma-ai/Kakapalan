<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SKY FIGHTER 8.0</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#030719;
 color:white;font-family:Arial;
 touch-action:none
}
canvas{display:block;width:100%;height:100%}
button{
 color:white;
 background:linear-gradient(135deg,#1764a9,#102044);
 border:1px solid #65eaff;
 border-radius:12px;
 padding:13px 22px;
 font-size:16px;font-weight:bold;
 margin:6px;
 box-shadow:0 0 14px #00bfff55
}
#menu,#result,#pause,#levels{
 position:absolute;inset:0;
 display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;
 background:linear-gradient(#020719ee,#09142bf5);
 padding:18px
}
h1{
 font-size:clamp(30px,8vw,48px);
 color:#62eaff;text-shadow:0 0 20px #00cfff;
 margin:0 0 8px
}
p{color:#b9d9ff;line-height:1.5}
.small{font-size:12px;color:#91afd5}
#hud{
 display:none;position:absolute;
 top:10px;left:12px;right:12px;
 pointer-events:none;font-size:13px
}
#top{display:flex;justify-content:space-between}
.bar{
 height:10px;background:#25334d;
 border:1px solid #8cecff;
 border-radius:20px;overflow:hidden;margin-top:5px
}
.fill{height:100%;width:100%;
 background:linear-gradient(90deg,#00ffad,#00aaff)}
#bossBar{display:none;margin-top:8px}
#bossFill{background:linear-gradient(90deg,#ff285b,#ffb000)}
#bossName{text-align:center;color:#ff9bb4;margin-top:5px}
#msg{text-align:center;color:#8eeaff;margin-top:5px}
#pauseBtn{
 display:none;position:absolute;
 right:10px;bottom:12px
}
#levelGrid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px;width:min(95vw,380px);
 max-height:55vh;overflow-y:auto;
 touch-action:pan-y
}
.levelCell{
 padding:10px 3px;margin:0;
 font-size:13px;min-width:0
}
#pageInfo{margin:8px}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div id="top">
  <div>
   <b id="levelText">LEVEL 1</b><br>
   SCORE: <span id="scoreText">0</span>
  </div>
  <div style="width:110px;text-align:right">
   NYAWA
   <div class="bar"><div class="fill" id="hpFill"></div></div>
  </div>
 </div>

 <div id="bossName"></div>
 <div class="bar" id="bossBar">
  <div class="fill" id="bossFill"></div>
 </div>
 <div id="msg"></div>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="menu">
 <h1>SKY FIGHTER</h1>
 <b style="color:#ffda73">GALAXY WAR 8.0</b>
 <p>Hadapi armada musuh dan kalahkan enam boss galaksi!</p>
 <button id="startBtn">MULAI BERMAIN</button>
 <button id="levelBtn">PILIH LEVEL</button>
 <p class="small">
 Geser jari untuk menggerakkan pesawat.<br>
 Tembakan berlangsung otomatis.
 </p>
</div>

<div id="levels" style="display:none">
 <h1>PILIH LEVEL</h1>
 <p id="pageInfo">Halaman 1 / 20</p>
 <div id="levelGrid"></div>
 <div>
  <button id="prevPage">◀</button>
  <button id="nextPage">▶</button>
 </div>
 <button id="closeLevels">KEMBALI</button>
</div>

<div id="result" style="display:none">
 <h1 id="resultTitle">VICTORY!</h1>
 <p id="resultText"></p>
 <button id="againBtn">LANJUT</button>
 <button id="homeBtn">MENU UTAMA</button>
</div>

<div id="pause" style="display:none">
 <h1>PAUSE</h1>
 <button id="resumeBtn">LANJUTKAN</button>
 <button id="pauseHomeBtn">MENU UTAMA</button>
</div>

<script>
(()=>{
"use strict";

// =============================
// DASAR GAME
// =============================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});
const $=id=>document.getElementById(id);

let W=innerWidth,H=innerHeight,DPR=1;

let state="menu";
let level=1,unlocked=1,score=0;
let player=null,boss=null;

let enemies=[];
let shots=[];
let enemyShots=[];
let particles=[];
let drops=[];
let stars=[];

let spawnTimer=0;
let spawned=0;
let spawnLimit=0;
let fireTimer=0;
let shake=0;
let gameTime=0;
let lastTime=0;

const BOSS_NAMES=[
 "Dona the angry",
 "Rizki the smart",
 "Isal the friend",
 "I am sad",
 "I'm trying",
 "Bos paneri"
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>Math.random()*(b-a)+a;

try{
 unlocked=Math.max(1,Number(localStorage.getItem("sky8Unlocked")||1));
}catch(e){unlocked=1}

function resize(){
 W=innerWidth;
 H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,1.25);

 canvas.width=Math.floor(W*DPR);
 canvas.height=Math.floor(H*DPR);

 ctx.setTransform(DPR,0,0,DPR,0,0);
 makeStars();
}

addEventListener("resize",resize);

function makeStars(){
 stars=[];
 for(let i=0;i<85;i++){
  stars.push({
   x:rand(0,W),
   y:rand(0,H),
   size:rand(.5,2),
   speed:rand(20,90),
   alpha:rand(.3,1)
  });
 }
}

resize();

// =============================
// MENU DAN LEVEL
// =============================

function buildLevelGrid(){
 const grid=$("levelGrid");
 grid.innerHTML="";

 let start=(page-1)*50+1;
 let end=Math.min(1000,start+49);

 $("pageInfo").textContent="Halaman "+page+" / 20";

 for(let i=start;i<=end;i++){
  let btn=document.createElement("button");
  btn.className="levelCell";
  btn.textContent=i<=unlocked?i:"🔒";
  btn.style.opacity=i<=unlocked?"1":".45";

  btn.onclick=()=>{
   if(i<=unlocked){
    level=i;
    startGame();
   }
  };

  grid.appendChild(btn);
 }
}

let page=1;

$("levelBtn").onclick=()=>{
 page=1;
 buildLevelGrid();
 $("levels").style.display="flex";
 $("menu").style.display="none";
};

$("prevPage").onclick=()=>{
 page=Math.max(1,page-1);
 buildLevelGrid();
};

$("nextPage").onclick=()=>{
 page=Math.min(20,page+1);
 buildLevelGrid();
};

$("closeLevels").onclick=()=>{
 $("levels").style.display="none";
 $("menu").style.display="flex";
};

$("startBtn").onclick=()=>{
 level=1;
 startGame();
};

$("homeBtn").onclick=goMenu;
$("pauseHomeBtn").onclick=goMenu;

function goMenu(){
 state="menu";
 $("menu").style.display="flex";
 $("result").style.display="none";
 $("pause").style.display="none";
 $("hud").style.display="none";
 $("pauseBtn").style.display="none";
 $("levels").style.display="none";
}

function startGame(){
 resetGame();

 state="play";

 $("menu").style.display="none";
 $("levels").style.display="none";
 $("result").style.display="none";
 $("pause").style.display="none";
 $("hud").style.display="block";
 $("pauseBtn").style.display="block";

 lastTime=performance.now();
}

// =============================
// RESET GAME
// =============================

function resetGame(){
 player={
  x:W/2,
  y:H*.78,
  hp:100,
  shield:0,
  triple:0,
  rapid:0,
  inv:0
 };

 boss=null;

 enemies=[];
 shots=[];
 enemyShots=[];
 particles=[];
 drops=[];

 score=0;
 spawned=0;

 spawnLimit=7+Math.min(35,Math.floor(level*.7));

 spawnTimer=.7;
 fireTimer=0;
 shake=0;
 gameTime=0;

 $("bossBar").style.display="none";
 $("bossName").textContent="";
 $("msg").textContent="";
}

// =============================
// HASIL GAME
// =============================

function finish(win){
 state="result";

 $("result").style.display="flex";
 $("pauseBtn").style.display="none";

 if(win){
  $("resultTitle").textContent="VICTORY!";
  $("resultText").textContent=
   BOSS_NAMES[(level-1)%6]+" berhasil dikalahkan!";

  unlocked=Math.max(unlocked,level+1);

  try{
   localStorage.setItem("sky8Unlocked",unlocked);
  }catch(e){}

  $("againBtn").textContent="LEVEL BERIKUTNYA";
 }else{
  $("resultTitle").textContent="GAME OVER";
  $("resultText").textContent="Energi pesawat habis!";
  $("againBtn").textContent="COBA LAGI";
 }
}

$("againBtn").onclick=()=>{
 if($("resultTitle").textContent==="VICTORY!"){
  level=Math.min(1000,level+1);
 }
 startGame();
};

// =============================
// KONTROL
// =============================

let touching=false;

function movePlayer(x,y){
 if(!player)return;

 player.x=clamp(x,25,W-25);
 player.y=clamp(y,55,H-30);
}

canvas.addEventListener("pointerdown",e=>{
 touching=true;
 if(state==="play")movePlayer(e.clientX,e.clientY);
});

canvas.addEventListener("pointermove",e=>{
 if(touching&&state==="play"){
  movePlayer(e.clientX,e.clientY);
 }
});

addEventListener("pointerup",()=>touching=false);
addEventListener("pointercancel",()=>touching=false);

$("pauseBtn").onclick=()=>{
 if(state==="play"){
  state="pause";
  $("pause").style.display="flex";
 }
};

$("resumeBtn").onclick=()=>{
 state="play";
 $("pause").style.display="none";
 lastTime=performance.now();
};

// =============================
// EFEK LEDAKAN
// =============================

function explosion(x,y,color,count=12){
 for(let i=0;i<count;i++){
  let angle=Math.random()*Math.PI*2;
  let speed=rand(40,200);

  particles.push({
   x,y,
   vx:Math.cos(angle)*speed,
   vy:Math.sin(angle)*speed,
   life:rand(.3,.8),
   max:.8,
   size:rand(2,5),
   color
  });
 }

 if(particles.length>190){
  particles.splice(0,particles.length-190);
 }
}

// =============================
// TEMBAKAN
// =============================

function shoot(){
 let angles=player.triple>0?[-.22,0,.22]:[0];

 for(let a of angles){
  shots.push({
   x:player.x+Math.sin(a)*18,
   y:player.y-20,
   vx:Math.sin(a)*230,
   vy:-590
  });
 }
}

// =============================
// MUSUH
// =============================

function createEnemy(x=null,y=-30,type=null){
 type=type===null?Math.floor(rand(0,6)):type;

 let sx=x===null?rand(30,W-30):x;

 enemies.push({
  x:sx,
  y,
  startX:sx,
  age:0,
  type,
  speed:rand(65,105)+level*1.5,
  hp:type===4?3:1,
  fire:rand(1.8,3.5)
 });
}

function formation(){
 let n=3+Math.floor(rand(0,3));
 let gap=Math.min(65,(W-50)/n);
 let startX=(W-gap*(n-1))/2;

 for(let i=0;i<n;i++){
  createEnemy(
   startX+i*gap,
   -30-i*8,
   Math.floor(rand(0,6))
  );
 }
}

// =============================
// BOSS
// =============================

function createBoss(){
 let type=(level-1)%6;

 boss={
  type,
  x:W/2,
  y:-100,
  tx:W/2,
  ty:Math.max(100,H*.19),
  hp:75+level*2,
  max:75+level*2,
  age:0,
  fire:1.3,
  entered:false
 };

 $("bossName").textContent="⚠ "+BOSS_NAMES[type];
 $("bossBar").style.display="block";
}

// =============================
// SERANGAN BOSS
// =============================

function bossAttack(){
 if(!boss)return;

 let b=boss;
 let aim=Math.atan2(
  player.y-b.y,
  player.x-b.x
 );

 let count=3+(b.type%4);

 for(let i=0;i<count;i++){
  let angle=aim+(i-(count-1)/2)*.18;

  enemyShots.push({
   x:b.x,
   y:b.y+20,
   vx:Math.cos(angle)*190,
   vy:Math.sin(angle)*190,
   size:5
  });
 }

 if(b.type===2||b.type===5){
  for(let i=-2;i<=2;i++){
   enemyShots.push({
    x:b.x+i*20,
    y:b.y,
    vx:i*55,
    vy:230,
    size:5
   });
  }
 }
}

// =============================
// TABRAKAN
// =============================

function collide(a,b,r){
 let dx=a.x-b.x;
 let dy=a.y-b.y;
 return dx*dx+dy*dy<r*r;
}

function hitPlayer(){
 if(player.inv>0)return;

 if(player.shield>0){
  player.shield=0;
  player.inv=.7;
  explosion(player.x,player.y,"#59eeff",18);
  return;
 }

 player.hp-=20;
 player.inv=1;
 shake=7;

 explosion(player.x,player.y,"#ff557a",15);

 if(player.hp<=0){
  player.hp=0;
  finish(false);
 }
}

// =============================
// POWER UP
// =============================

function powerDrop(x,y){
 if(Math.random()<.2){
  let types=["heal","shield","triple","rapid"];

  drops.push({
   x,y,
   type:types[Math.floor(Math.random()*4)]
  });
 }
}

// =============================
// GERAKAN BOSS HALUS
// =============================

function updateBoss(dt){
 if(!boss)return;

 let b=boss;
 b.age+=dt;

 let t=b.age;

 if(!b.entered){

  // Boss masuk perlahan ke arena
  let smooth=1-Math.exp(-dt*2);

  b.x+=(W/2-b.x)*smooth;
  b.y+=(b.ty-b.y)*smooth;

  if(Math.abs(b.y-b.ty)<1.5){
   b.y=b.ty;
   b.entered=true;
  }

 }else{

  let center=W/2;
  let range=Math.min(W*.3,125);
  let vertical=0;

  // Enam pola gerakan berbeda
  switch(b.type){

   case 0:
    b.tx=center+Math.sin(t*.9)*range;
    break;

   case 1:
    b.tx=center+Math.sin(t*1.3)*range;
    vertical=Math.sin(t*1.5)*18;
    break;

   case 2:
    b.tx=center+Math.sin(t*.7)*range*.7;
    break;

   case 3:
    b.tx=center+Math.sin(t*1.6)*range;
    vertical=Math.sin(t*1.8)*25;
    break;

   case 4:
    b.tx=center+Math.sin(t*1.1)*range*.8;
    vertical=Math.cos(t*1.3)*20;
    break;

   case 5:
    b.tx=center+Math.sin(t*1.4)*range;
    vertical=Math.sin(t*1.5)*22;
    break;
  }

  b.tx=clamp(b.tx,70,W-70);

  // Interpolasi berbasis waktu
  let smooth=1-Math.exp(-dt*2.8);

  b.x+=(b.tx-b.x)*smooth;
  b.y+=(b.ty+vertical-b.y)*smooth;
 }

 // Serangan
 b.fire-=dt;

 if(b.fire<=0){
  bossAttack();
  b.fire=b.type===4?.7:1.05;
 }

 // Peluru pemain mengenai boss
 for(let i=shots.length-1;i>=0;i--){
  if(collide(shots[i],b,65)){
   b.hp--;

   explosion(
    shots[i].x,
    shots[i].y,
    "#fff0a0",
    3
   );

   shots.splice(i,1);
  }
 }

 if(b.hp<=0){
  score+=500;
  explosion(b.x,b.y,"#ffcf5c",65);
  boss=null;
  finish(true);
 }
}

// =============================
// UPDATE GAME
// =============================

function update(dt){
 if(state!=="play")return;

 gameTime+=dt;

 // Bintang
 for(let s of stars){
  s.y+=s.speed*dt;

  if(s.y>H){
   s.y=0;
   s.x=rand(0,W);
  }
 }

 // Efek power-up
 player.inv=Math.max(0,player.inv-dt);
 player.shield=Math.max(0,player.shield-dt);
 player.triple=Math.max(0,player.triple-dt);
 player.rapid=Math.max(0,player.rapid-dt);

 // Auto fire
 fireTimer-=dt;

 if(fireTimer<=0){
  shoot();
  fireTimer=player.rapid>0?.085:.19;
 }

 // Spawn musuh
 if(!boss&&spawned<spawnLimit){
  spawnTimer-=dt;

  if(spawnTimer<=0){
   if(Math.random()<.35)formation();
   else createEnemy();

   spawned++;
   spawnTimer=Math.max(.3,1.05-level*.02);
  }
 }

 // Gerakan musuh
 for(let e of enemies){
  e.age+=dt;

  let t=e.age;

  e.y+=e.speed*dt;

  if(e.type===0){
   e.x=e.startX+Math.sin(t*2.6)*60;
  }

  if(e.type===1){
   e.x=e.startX+Math.sin(t*1.8)*95;
  }

  if(e.type===2){
   e.x+=(player.x-e.x)*Math.min(1,dt*.45);
  }

  if(e.type===3){
   e.x=e.startX+Math.sin(t*3)*70;
   e.y+=Math.cos(t*3)*12*dt;
  }

  if(e.type===4){
   e.x=e.startX+Math.sin(t*1.5)*40;
  }

  if(e.type===5){
   e.x+=Math.sin(t*5)*75*dt;
  }

  // Musuh menembak
  e.fire-=dt;

  if(e.fire<=0&&e.y>0&&e.y<H*.65){
   enemyShots.push({
    x:e.x,
    y:e.y+10,
    vx:(player.x-e.x)*.25,
    vy:190+level*1.5,
    size:4
   });

   e.fire=rand(2,4);
  }

  if(collide(e,player,23)){
   hitPlayer();
   e.hp=0;
  }
 }

 enemies=enemies.filter(e=>e.y<H+50&&e.hp>0);

 // Peluru pemain
 for(let i=shots.length-1;i>=0;i--){
  let s=shots[i];

  s.x+=s.vx*dt;
  s.y+=s.vy*dt;

  if(s.y<-30){
   shots.splice(i,1);
   continue;
  }

  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];

   if(collide(s,e,20)){
    e.hp--;
    shots.splice(i,1);

    if(e.hp<=0){
     score+=10;

     explosion(e.x,e.y,"#ff945d",10);
     powerDrop(e.x,e.y);

     enemies.splice(j,1);
    }

    break;
   }
  }
 }

 // Boss muncul setelah semua musuh habis
 if(!boss&&spawned>=spawnLimit&&enemies.length===0){
  createBoss();
 }

 updateBoss(dt);

 // Peluru musuh
 for(let i=enemyShots.length-1;i>=0;i--){
  let b=enemyShots[i];

  b.x+=b.vx*dt;
  b.y+=b.vy*dt;

  if(b.y>H+30||b.x<-30||b.x>W+30){
   enemyShots.splice(i,1);
   continue;
  }

  if(collide(b,player,22)){
   enemyShots.splice(i,1);
   hitPlayer();

   if(state!=="play")return;
  }
 }

 // Power up
 for(let p of drops){
  p.y+=100*dt;

  if(collide(p,player,25)){
   if(p.type==="heal")
    player.hp=Math.min(100,player.hp+35);

   if(p.type==="shield")
    player.shield=6;

   if(p.type==="triple")
    player.triple=10;

   if(p.type==="rapid")
    player.rapid=10;

   p.dead=true;
   explosion(p.x,p.y,"#69ffff",12);
  }
 }

 drops=drops.filter(p=>p.y<H+30&&!p.dead);

 // Partikel
 for(let p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  p.vx*=.975;
  p.vy*=.975;

  p.life-=dt;
 }

 particles=particles.filter(p=>p.life>0);

 shake=Math.max(0,shake-dt*18);

 // HUD
 $("levelText").textContent="LEVEL "+level;
 $("scoreText").textContent=score;
 $("hpFill").style.width=player.hp+"%";

 if(boss){
  $("bossFill").style.width=
   clamp(boss.hp/boss.max*100,0,100)+"%";
 }

 $("msg").textContent=
  player.triple>0?"TRIPLE SHOT AKTIF":
  player.rapid>0?"RAPID FIRE AKTIF":
  player.shield>0?"SHIELD AKTIF":"";
}

// =============================
// BACKGROUND
// =============================

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);

 g.addColorStop(0,"#060b2b");
 g.addColorStop(.5,"#11133b");
 g.addColorStop(1,"#020719");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<3;i++){
  let x=W*(.2+i*.3);

  let grad=ctx.createRadialGradient(
   x,H*.35,2,x,H*.35,W*.3
  );

  grad.addColorStop(0,"#433caa44");
  grad.addColorStop(1,"transparent");

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
 }

 for(let s of stars){
  ctx.globalAlpha=s.alpha;
  ctx.fillStyle="#d9f5ff";
  ctx.fillRect(s.x,s.y,s.size,s.size*2);
 }

 ctx.globalAlpha=1;

 // Planet
 let x=W*.82;
 let y=H*.27;
 let r=Math.min(W,H)*.105;

 let pg=ctx.createRadialGradient(
  x-r*.3,y-r*.3,2,x,y,r
 );

 pg.addColorStop(0,"#b5caff");
 pg.addColorStop(.6,"#4657a8");
 pg.addColorStop(1,"#101b4c");

 ctx.fillStyle=pg;
 ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fill();
}

// =============================
// PESAWAT PEMAIN
// =============================

function drawPlayer(){
 if(!player)return;

 ctx.save();
 ctx.translate(player.x,player.y);

 if(player.inv>0&&Math.floor(player.inv*12)%2===0){
  ctx.globalAlpha=.4;
 }

 let flame=15+Math.sin(gameTime*18)*5;

 let fg=ctx.createLinearGradient(0,5,0,flame+20);
 fg.addColorStop(0,"#fff3a0");
 fg.addColorStop(.5,"#00dfff");
 fg.addColorStop(1,"transparent");

 ctx.fillStyle=fg;

 ctx.beginPath();
 ctx.moveTo(-7,10);
 ctx.lineTo(0,flame+20);
 ctx.lineTo(7,10);
 ctx.fill();

 ctx.fillStyle="#176ebc";
 ctx.strokeStyle="#9af4ff";
 ctx.lineWidth=2;

 ctx.beginPath();
 ctx.moveTo(0,-29);
 ctx.lineTo(29,18);
 ctx.lineTo(8,12);
 ctx.lineTo(0,20);
 ctx.lineTo(-8,12);
 ctx.lineTo(-29,18);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 let g=ctx.createLinearGradient(-9,0,9,0);
 g.addColorStop(0,"#3159a6");
 g.addColorStop(.5,"#e5ffff");
 g.addColorStop(1,"#3159a6");

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(0,-29);
 ctx.lineTo(10,12);
 ctx.lineTo(0,20);
 ctx.lineTo(-10,12);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#37edff";
 ctx.beginPath();
 ctx.ellipse(0,-8,4,8,0,0,Math.PI*2);
 ctx.fill();

 if(player.shield>0){
  ctx.strokeStyle="#54eaff";
  ctx.lineWidth=3;
  ctx.shadowBlur=15;
  ctx.shadowColor="#00dfff";

  ctx.beginPath();
  ctx.arc(0,0,36,0,Math.PI*2);
  ctx.stroke();
 }

 ctx.restore();
}

// PESAWAT MUSUH

function drawEnemy(e){
 ctx.save();
 ctx.translate(e.x,e.y);
 ctx.rotate(Math.PI);

 let colors=[
  "#bd345d","#7950d8","#e66a38",
  "#3289bb","#d59d36","#5a6caa"
 ];

 ctx.fillStyle=colors[e.type];
 ctx.strokeStyle="#ffc2db";
 ctx.lineWidth=1.5;

 ctx.beginPath();

 if(e.type===0){
  ctx.moveTo(0,-18);
  ctx.lineTo(19,13);
  ctx.lineTo(0,8);
  ctx.lineTo(-19,13);
 }
 else if(e.type===1){
  ctx.moveTo(-22,-8);
  ctx.lineTo(-8,-16);
  ctx.lineTo(0,8);
  ctx.lineTo(8,-16);
  ctx.lineTo(22,-8);
  ctx.lineTo(10,17);
  ctx.lineTo(-10,17);
 }
 else if(e.type===2){
  ctx.moveTo(0,-20);
  ctx.lineTo(17,10);
  ctx.lineTo(8,17);
  ctx.lineTo(-8,17);
  ctx.lineTo(-17,10);
 }
 else if(e.type===3){
  ctx.moveTo(0,-18);
  ctx.lineTo(23,0);
  ctx.lineTo(8,17);
  ctx.lineTo(-8,17);
  ctx.lineTo(-23,0);
 }
 else if(e.type===4){
  ctx.moveTo(0,-20);
  ctx.lineTo(24,-5);
  ctx.lineTo(20,15);
  ctx.lineTo(0,20);
  ctx.lineTo(-20,15);
  ctx.lineTo(-24,-5);
 }
 else{
  ctx.moveTo(0,-20);
  ctx.lineTo(12,-3);
  ctx.lineTo(25,12);
  ctx.lineTo(5,10);
  ctx.lineTo(0,20);
  ctx.lineTo(-5,10);
  ctx.lineTo(-25,12);
  ctx.lineTo(-12,-3);
 }

 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle="#fff18b";
 ctx.fillRect(-3,-4,6,6);

 ctx.restore();
}

 ctx.rotate(Math.sin(b.age*.7)*.035);

 ctx.lineJoin="round";
 ctx.shadowBlur=15;

  "#bd365f","#7046be","#b16b39",

 }

 // BOSS 4 - I am sad
 else if(b.type===3){

  ctx.lineTo(58,20);

 // BOSS 6 - Bos paneri
 else{

// =============================
// GAMBAR PELURU
// =============================

function drawShots(){
 ctx.save();

 ctx.shadowBlur=10;
 ctx.shadowColor="#32eeff";
 ctx.fillStyle="#caffff";

 for(let s of shots){
  ctx.fillRect(s.x-2,s.y-12,4,15);
 }

 ctx.restore();

 for(let b of enemyShots){
  ctx.fillStyle="#ff668b";

  ctx.beginPath();
  ctx.arc(b.x,b.y,b.size||5,0,Math.PI*2);
  ctx.fill();
 }
}

// =============================
// GAMBAR POWER UP
// =============================

function drawDrops(){
 let colors={
  heal:"#5dff9c",
  shield:"#55dfff",
  triple:"#ffdc55",
  rapid:"#ff73cf"
 };

 for(let p of drops){
  ctx.fillStyle=colors[p.type];

  ctx.beginPath();
  ctx.arc(p.x,p.y,12,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#09162a";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
   p.type==="heal"?"+":
   p.type==="shield"?"S":
   p.type==="triple"?"3":"R",
   p.x,p.y
  );
 }
}

// =============================
// PARTIKEL
// =============================

function drawParticles(){
 for(let p of particles){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }

 ctx.globalAlpha=1;
}

// =============================
// GAMBAR SEMUA
// =============================

function draw(){
 ctx.save();

 if(shake>0){
  ctx.translate(rand(-shake,shake),rand(-shake,shake));
 }

 drawBackground();

 if(player){
  drawShots();

  enemies.forEach(drawEnemy);

  if(boss)drawBoss(boss);

  drawDrops();
  drawParticles();
  drawPlayer();
 }

 ctx.restore();
}

// =============================
// GAME LOOP
// =============================

function loop(now){
 let dt=Math.min((now-lastTime)/1000||0,.033);
 lastTime=now;

 if(state==="play"){
  update(dt);
 }

 draw();

 requestAnimationFrame(loop);
}

lastTime=performance.now();
requestAnimationFrame(loop);

})();
</script>
